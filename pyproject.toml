[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-analyzer"
version = "2.0.0"
description = "Play Stockfish with live analysis, and learn openings with a spaced-repetition trainer that explains the plans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Federico Traina" }]
keywords = ["chess", "stockfish", "pygame", "opening-trainer", "spaced-repetition", "fsrs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "pygame>=2.5",
    "chess>=1.11",
    "fsrs>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Fedetrain/chess-analyzer"
Issues = "https://github.com/Fedetrain/chess-analyzer/issues"

[project.scripts]
chess-analyzer = "main:main"

[tool.setuptools]
# Flat module layout: every module sits at the repository root.
py-modules = [
    "main", "config", "engine", "game", "drawing", "ui",
    "analysis", "coach", "structures", "openings",
    "repertoire", "trainer", "review", "chess_utils", "pgn_handler",
]

[tool.setuptools.package-data]
"*" = ["data/eco/*.tsv", "data/plans/*.json", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # function call in default argument: not used here
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # tests set SDL env vars before importing pygame
"tools/*" = ["E402"]        # tools adjust sys.path before importing the app
